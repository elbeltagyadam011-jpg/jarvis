name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Build APK with Free Android Builder
      uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: 29
        target: default
        arch: x86_64
        script: echo "Building..."

    - name: Compile Single Files to APK
      run: |
        javac *.java
        jar cf jarvis.jar *.class
        dx --dex --output=classes.dex jarvis.jar
        aapt package -f -M AndroidManifest.xml -I /usr/local/lib/android/sdk/platforms/android-33/android.jar -F jarvis.apk
        zipalign -v -p 4 jarvis.apk app-debug.apk

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app-debug.apk
