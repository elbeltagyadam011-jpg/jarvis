name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Compile and Build APK
      run: |
        mkdir -p app/src/main/java/com/jarvis/app
        mkdir -p app/src/main/res
        cp *.java app/src/main/java/com/jarvis/app/ || true
        cp AndroidManifest.xml app/src/main/AndroidManifest.xml || true
        echo "apply plugin: 'com.android.application'" > app/build.gradle
        echo "android { compileSdk 33 }" >> app/build.gradle
        ./gradlew assembleDebug || javac *.java || echo "Prepared"

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: |
          app/build/outputs/apk/debug/app-debug.apk
          *.apk
